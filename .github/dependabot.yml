version: 2
# Every entry runs every day at 00:00 JST on a cron schedule; `interval: daily`
# runs on weekdays only.
updates:
  # The workflow actions. Actions are SHA-pinned with a version comment
  # (`@<sha> # vX.Y.Z`); Dependabot bumps the pin and comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Asia/Tokyo"
  # pyproject.toml's yt-dlp pin. A version is offered three days after its
  # release (Dependabot's default cooldown).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Asia/Tokyo"
