name: CI

# Runs the test suite on every pull request and on pushes to main. The job reports `test`, a required status
# check of main, so the pull request trigger carries no filter: a run a filter skips reports nothing, and the
# check never arrives.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q
