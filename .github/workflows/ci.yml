name: CI

# Runs the test suite on every pull request and on pushes to main. The job reports `test`, a required status
# check of main, so the pull request trigger carries no filter: a run a filter skips reports nothing, and the
# check never arrives.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The Codecov upload authenticates with GitHub's OIDC token instead of a stored token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov

      - name: Run tests
        run: python -m pytest -q --cov --cov-report=xml

      # A failed upload leaves the job green, the steps of the action before the upload itself (the OIDC token
      # request among them) included: the Codecov statuses are not required checks.
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        timeout-minutes: 5
        continue-on-error: true
        with:
          fail_ci_if_error: false
          files: ./coverage.xml
          use_oidc: true
